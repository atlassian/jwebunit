<html>
<head><title>Checkbox Case Insensitive Test</title></head>
<body>
<!--
    Tests the XPath translate() fix in WebTester.assertCheckboxPresent / assertCheckboxNotPresent.
    HtmlUnit 3.x uses a strict XPath 1.0 evaluator (Apache Xalan) that rejects lower-case()
    (an XPath 2.0 function). The fix uses translate(@type, 'ABC...', 'abc...') for
    case-insensitive matching. These four checkboxes exercise lowercase, UPPERCASE, and
    mixed-case type attributes to confirm the translate() expression handles all variants.
-->
<form method="GET" action="../params.jsp">
    <input type="checkbox"  name="cb1" value="1">  <!-- lowercase  -->
    <input TYPE="CHECKBOX"  name="cb2" value="2">  <!-- UPPERCASE  -->
    <input type="CheckBox"  name="cb3" value="3">  <!-- MixedCase  -->
    <input TYPE="CHECKBOX"  name="cb4" value="val1"> <!-- for name+value test -->
    <input type="submit" value="Submit">
</form>
</body>
</html>
