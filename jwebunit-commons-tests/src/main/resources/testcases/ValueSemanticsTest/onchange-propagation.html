<html>
<head><title>OnChange Propagation Test</title></head>
<body>
<!--
    Verifies that IElement.setAttribute("value", ...) writes the live DOM value so that
    the onChange handler can read it via this.value. If setValueAttribute() were used
    instead (mutating only the HTML attribute), this.value would still return the old
    live value and onChange would propagate the wrong value to js2.
-->
<form method="GET" action="../params.jsp">
    <input type="text" id="js1" name="js1" value="initial"
           onChange="document.getElementById('js2').value=this.value;">
    <input type="text" id="js2" name="js2" value="unchanged">
    <input type="submit" id="submitBtn" value="Submit">
</form>
</body>
</html>
