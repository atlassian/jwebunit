<html>
<head><title>Form Reset Test</title></head>
<body>
<!--
    Verifies that HtmlInput.setValue() (used by setTextField) writes only the live DOM value
    and does not mutate the HTML attribute that form.reset() uses as the default.
    After setTextField("field", "newVal") + reset(), the field must revert to "originalDefault".
-->
<form method="GET" action="../params.jsp">
    <input type="text" name="field" id="field" value="originalDefault">
    <input type="reset"   id="resetBtn"  value="Reset">
    <input type="submit"  id="submitBtn" value="Submit">
</form>
</body>
</html>
