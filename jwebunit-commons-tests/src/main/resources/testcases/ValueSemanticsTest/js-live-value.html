<html>
<head><title>JS Live Value Test</title></head>
<body>
<!--
    Verifies that getTextFieldValue() and IElement.getAttribute("value") return the live DOM
    value after JavaScript has changed it, not the stale HTML attribute.
    Clicking #trigger sets field.value = "jsUpdated" without touching the HTML attribute.
-->
<form method="GET" action="../params.jsp" name="testform">
    <input type="text" name="field" id="field" value="initial">
    <input type="button" id="trigger" value="Update"
           onclick="document.getElementById('field').value='jsUpdated'">
    <input type="submit" id="submitBtn" value="Submit">
</form>
</body>
</html>
