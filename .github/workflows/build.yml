name: Build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8' # match the project's compiler target (source/target 1.7; Temurin's lowest LTS is 8)
          cache: maven
      - run: mvn verify -e -V -B
